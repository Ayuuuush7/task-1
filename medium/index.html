<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>medium wala assignment</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.9.1/fonts/remixicon.css">
</head>

<body>
    <main>
        <header>
            <button>
                <i class="ele ri-menu-line"></i>
            </button>
            <img id="pokemon-logo" src="./pokemon-logo.png" alt="pokemon-logo">
            <button>
                <i class="ele ri-sun-line"></i>
            </button>
        </header>

        <section id="section-1">
            <input type="text" placeholder="Search for a Pokemon..">
            <div style="display: flex;">
                <button id="search">Filter by types</button>
                <button>
                    <i class="ri-filter-3-fill"></i>
                </button>
            </div>
        </section>

        <section id="section-2">
            <div class="cards">1</div>
            <div class="cards">2</div>
            <div class="cards">3</div>
            <div class="cards">4</div>
        </section>

        <footer>2024 Pokemon.All rights reserved</footer>
    </main>
</body>

</html>
